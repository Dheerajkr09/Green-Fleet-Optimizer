services:
  - type: web
    name: green-fleet-optimizer
    runtime: python
    buildCommand: |
      npm install && npm run build && pip install -r requirements.txt
    startCommand: gunicorn backend.app:app --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.18.0
